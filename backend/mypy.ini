[mypy]
# Version de Python utilisée dans ton projet — mypy adapte ses vérifications en conséquence
python_version = 3.11

# Active TOUS les flags stricts d'un coup (équivaut à activer toutes les options ci-dessous et plus)
# Si tu mets strict = true, les options suivantes sont redondantes mais restent explicites
strict = true

# Interdit de retourner "Any" implicitement depuis une fonction typée
# Ex: si tu appelles une fonction non typée et retournes son résultat sans cast → erreur
warn_return_any = true

# Avertit si tu as des options dans mypy.ini qui ne servent à rien (fautes de frappe, options obsolètes)
warn_unused_configs = true

# Oblige à typer TOUS les paramètres et le retour de chaque fonction
# Ex: def greet(name) -> erreur, il faut def greet(name: str) -> str
disallow_untyped_defs = true

# Interdit les fonctions partiellement typées
# Ex: def greet(name: str) sans -> str → erreur, il faut annoter le retour aussi
disallow_incomplete_defs = true

# Analyse le corps des fonctions non typées malgré tout (utile en migration progressive)
# Sans ça, mypy ignore complètement l'intérieur des fonctions sans annotations
check_untyped_defs = true

# Interdit le "Optional" implicite quand une valeur par défaut est None
# Ex: def f(x: str = None) → erreur, il faut def f(x: str | None = None)
no_implicit_optional = true

# Avertit si tu fais un cast() inutile car le type est déjà correct
# Ex: cast(str, ma_variable) alors que ma_variable est déjà str → warning
warn_redundant_casts = true

# Avertit si tu as des "# type: ignore" qui ne servent plus à rien
# Évite de laisser des suppressions d'erreurs obsolètes traîner dans le code
warn_unused_ignores = true

plugins = mypy_django_plugin.main

[mypy.plugins.django-stubs]
django_settings_module = "settings"