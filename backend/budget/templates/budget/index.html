{% extends "toolbox/base.html" %}
{% load static %}

{% block title %}
    Budget
{% endblock %}

{% block extra_css %}
    <link rel="stylesheet" href="{% static 'budget/css/style.css' %}">
{% endblock %}

{% block content %}

    <div class="p-6">

        <h1 class="text-2xl font-bold">
            BUDGET: {{ prenom }} {{ nom|upper }}
        </h1>

        <p class="text-gray-600">
            {{ date|date:"d F Y H:i:s" }}
        </p>

        <div class="bg-blue-500 text-white p-4 rounded mt-4">
            Tailwind fonctionne 🚀
        </div>

    </div>

{% endblock %}
