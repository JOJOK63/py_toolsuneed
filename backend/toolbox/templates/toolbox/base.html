{% load static %}
{% load tailwind_tags %}

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">

    <title>{% block title %}Toolbox{% endblock %}</title>

    <!-- CSS global -->
    <link rel="stylesheet" href="{% static 'toolbox/css/base.css' %}">
    <!-- Tailwind -->
    {% tailwind_css %}

    {% block extra_css %}{% endblock %}
</head>

<body>

<!-- NAVBAR globale -->
{% block navbar %}
    <nav class="p-4 bg-gray-800 text-white text-center">
        <h1>Ma navbar</h1>
    </nav>
{% endblock %}

<!-- CONTENU -->
<main class="container mx-auto p-4 bg-yellow-200">
    {% block content %}{% endblock %}
</main>

{% block extra_js %}
{% endblock %}

</body>
</html>
